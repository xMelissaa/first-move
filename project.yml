name: FirstMove
options:
  bundleIdPrefix: org.firstmove
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    FIRSTMOVE_ACCOUNTS_ENABLED: "NO"
    FIRSTMOVE_ENTITLEMENTS: ""
targets:
  FirstMove:
    type: application
    platform: iOS
    sources:
      - path: Knightly
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: First Move
        PRODUCT_MODULE_NAME: FirstMove
        PRODUCT_BUNDLE_IDENTIFIER: org.firstmove.chess
        INFOPLIST_FILE: Knightly/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "$(FIRSTMOVE_ENTITLEMENTS)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
    attributes:
      ProvisioningStyle: Automatic
  FirstMoveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KnightlyTests
    dependencies:
      - target: FirstMove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.firstmove.chess.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/First Move.app/First Move"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FirstMoveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FirstMoveUITests
    dependencies:
      - target: FirstMove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.firstmove.chess.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: FirstMove
schemes:
  FirstMove:
    build:
      targets:
        FirstMove: all
        FirstMoveTests: [test]
        FirstMoveUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FirstMoveTests
        - FirstMoveUITests
      gatherCoverageData: true
    archive:
      config: Release
